name: Build FullScreen Mosaic APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate Project and Build APK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

          mkdir -p app/src/main/java/com/example/mosaicoverlay

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MosaicOverlay"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.example.mosaicoverlay'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.mosaicoverlay"
                  minSdk 29
                  targetSdk 33
                  versionCode 5
                  versionName "5.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <application
                  android:allowBackup="true"
                  android:label="전체화면 모자이크"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".MosaicService"
                      android:enabled="true"
                      android:exported="false"
                      android:configChanges="orientation|screenSize|screenLayout"
                      android:foregroundServiceType="mediaProjection" />
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/mosaicoverlay/MainActivity.kt
          package com.example.mosaicoverlay

          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {
              private lateinit var projectionManager: MediaProjectionManager
              private val REQ_OVERLAY = 1001
              private val REQ_CAPTURE = 1002

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  projectionManager = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager

                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(60, 60, 60, 60)
                      setBackgroundColor(Color.parseColor("#F5F5F5"))
                  }
                  val infoText = TextView(this).apply {
                      text = "갤럭시 노트 10 전체화면 모자이크 v5.0\n(실시간 화면 반응형 & 무깜빡임 핀홀 엔진)\n\n" +
                             "• 화면을 껐다 켜지 않고 각 모자이크 블록 사이의 미세 핀홀(투명 틈)로 뒷배경 동영상의 실제 픽셀만 실시간 추출합니다.\n" +
                             "• 깜빡임(Flicker)과 잔상(Ghosting) 없이 실제 화면 움직임에 100% 반응하여 모자이크 처리됩니다.\n" +
                             "• 제어판에서 [모자이크 크기], [반응 속도(FPS)], [스타일]을 조절하세요."
                      textSize = 14f
                      setTextColor(Color.BLACK)
                      setPadding(0, 0, 0, 50)
                  }
                  val startBtn = Button(this).apply {
                      text = "반응형 모자이크 시작"
                      textSize = 17f
                      setOnClickListener { checkPermissionsAndStart() }
                  }
                  val stopBtn = Button(this).apply {
                      text = "모자이크 완전히 종료"
                      textSize = 17f
                      setOnClickListener {
                          stopService(Intent(this@MainActivity, MosaicService::class.java))
                      }
                  }
                  layout.addView(infoText)
                  layout.addView(startBtn)
                  layout.addView(stopBtn)
                  setContentView(layout)
              }

              private fun checkPermissionsAndStart() {
                  if (!Settings.canDrawOverlays(this)) {
                      Toast.makeText(this, "'다른 앱 위에 표시' 권한을 허용해주세요.", Toast.LENGTH_LONG).show()
                      val intent = Intent(
                          Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                          Uri.parse("package:$packageName")
                      )
                      startActivityForResult(intent, REQ_OVERLAY)
                  } else {
                      requestScreenCapture()
                  }
              }

              private fun requestScreenCapture() {
                  startActivityForResult(projectionManager.createScreenCaptureIntent(), REQ_CAPTURE)
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == REQ_OVERLAY) {
                      if (Settings.canDrawOverlays(this)) {
                          requestScreenCapture()
                      }
                  } else if (requestCode == REQ_CAPTURE) {
                      if (resultCode == RESULT_OK && data != null) {
                          val serviceIntent = Intent(this, MosaicService::class.java).apply {
                              putExtra("resultCode", resultCode)
                              putExtra("data", data)
                          }
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              startForegroundService(serviceIntent)
                          } else {
                              startService(serviceIntent)
                          }
                          moveTaskToBack(true)
                      } else {
                          Toast.makeText(this, "화면 캡처 권한이 취소되었습니다.", Toast.LENGTH_SHORT).show()
                      }
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/mosaicoverlay/MosaicService.kt
          package com.example.mosaicoverlay

          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.content.res.Configuration
          import android.graphics.*
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.*
          import android.util.DisplayMetrics
          import android.view.*
          import android.widget.*

          class MosaicService : Service() {
              private lateinit var windowManager: WindowManager
              private var mediaProjection: MediaProjection? = null
              private var virtualDisplay: VirtualDisplay? = null
              private var imageReader: ImageReader? = null
              private var mosaicView: ReactiveMosaicView? = null
              private var controlView: View? = null

              private var screenWidth = 1080
              private var screenHeight = 2280
              private var screenDensity = 400

              // 캡처 해상도 (원본의 1/4 크기로 캡처하여 60fps에서도 렉 없이 핀홀 픽셀을 정확히 추출)
              private val captureScale = 4
              private var capW = 270
              private var capH = 570

              // 모자이크 설정값
              @Volatile private var mosaicBlockSize = 36 // 화면 기준 모자이크 타일 크기 (16 ~ 96px)
              @Volatile private var targetFps = 30       // 실시간 반응 프레임 (10 ~ 60fps)
              @Volatile private var styleMode = 0        // 0: 꽉 찬 픽셀 모자이크, 1: 소프트 블렌딩 모자이크, 2: 원형 도트 모자이크
              @Volatile private var isEnabled = true
              @Volatile private var lastFrameTimeMs = 0L

              // 추출된 실시간 모자이크 색상 배열
              @Volatile private var gridColors: IntArray = IntArray(0)
              @Volatile private var gridCols = 0
              @Volatile private var gridRows = 0

              private val mainHandler = Handler(Looper.getMainLooper())
              private var bgThread: HandlerThread? = null
              private var bgHandler: Handler? = null

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  windowManager = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  updateScreenMetrics()
                  bgThread = HandlerThread("ReactiveMosaicThread", Process.THREAD_PRIORITY_DISPLAY).apply { start() }
                  bgHandler = Handler(bgThread!!.looper)
              }

              private fun updateScreenMetrics() {
                  val metrics = DisplayMetrics()
                  @Suppress("DEPRECATION")
                  windowManager.defaultDisplay.getRealMetrics(metrics)
                  screenWidth = metrics.widthPixels
                  screenHeight = metrics.heightPixels
                  screenDensity = metrics.densityDpi
                  capW = (screenWidth / captureScale).coerceAtLeast(100)
                  capH = (screenHeight / captureScale).coerceAtLeast(100)
              }

              override fun onConfigurationChanged(newConfig: Configuration) {
                  super.onConfigurationChanged(newConfig)
                  updateScreenMetrics()
                  bgHandler?.post { setupVirtualDisplay() }
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  startForegroundNotification()
                  val resultCode = intent?.getIntExtra("resultCode", Activity.RESULT_CANCELED) ?: Activity.RESULT_CANCELED
                  @Suppress("DEPRECATION")
                  val data: Intent? = intent?.getParcelableExtra("data")

                  if (resultCode == Activity.RESULT_OK && data != null) {
                      setupOverlayViews()
                      startScreenCapture(resultCode, data)
                  } else {
                      stopSelf()
                  }
                  return START_NOT_STICKY
              }

              private fun startForegroundNotification() {
                  val channelId = "mosaic_reactive_channel"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          channelId,
                          "실시간 반응형 모자이크 서비스",
                          NotificationManager.IMPORTANCE_LOW
                      )
                      val manager = getSystemService(NotificationManager::class.java)
                      manager.createNotificationChannel(channel)
                  }
                  val notification = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      Notification.Builder(this, channelId)
                          .setContentTitle("반응형 모자이크 v5.0 작동 중")
                          .setContentText("깜빡임 없는 실시간 픽셀 반응 엔진")
                          .setSmallIcon(android.R.drawable.ic_menu_view)
                          .build()
                  } else {
                      @Suppress("DEPRECATION")
                      Notification.Builder(this)
                          .setContentTitle("반응형 모자이크 작동 중")
                          .setSmallIcon(android.R.drawable.ic_menu_view)
                          .build()
                  }
                  startForeground(1, notification)
              }

              private fun setupOverlayViews() {
                  if (mosaicView != null) return
                  mosaicView = ReactiveMosaicView(this)

                  val overlayType = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  } else {
                      @Suppress("DEPRECATION")
                      WindowManager.LayoutParams.TYPE_PHONE
                  }

                  val mosaicParams = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      overlayType,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                              WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                              WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                              WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS or
                              WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = 0
                      y = 0
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                          layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                      }
                  }
                  windowManager.addView(mosaicView, mosaicParams)

                  val rootControl = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.argb(225, 20, 20, 20))
                      setPadding(24, 14, 24, 14)
                  }
                  val topRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  val titleText = TextView(this).apply {
                      text = "⠿ 모자이크 "
                      setTextColor(Color.WHITE)
                      textSize = 12f
                  }
                  val slidersContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(0, 10, 0, 0)
                  }

                  val styleBtn = Button(this).apply {
                      text = "사각타일"
                      textSize = 11f
                      setOnClickListener {
                          styleMode = (styleMode + 1) % 3
                          text = when (styleMode) {
                              0 -> "사각타일"
                              1 -> "밀착픽셀"
                              else -> "원형도트"
                          }
                          mosaicView?.invalidate()
                      }
                  }

                  val toggleBtn = Button(this).apply {
                      text = "ON"
                      textSize = 11f
                      setOnClickListener {
                          isEnabled = !isEnabled
                          if (isEnabled) {
                              mosaicView?.visibility = View.VISIBLE
                              text = "ON"
                          } else {
                              mosaicView?.visibility = View.INVISIBLE
                              text = "OFF"
                          }
                      }
                  }

                  val minBtn = Button(this).apply {
                      text = "접기"
                      textSize = 11f
                      setOnClickListener {
                          if (slidersContainer.visibility == View.VISIBLE) {
                              slidersContainer.visibility = View.GONE
                              text = "펼치기"
                          } else {
                              slidersContainer.visibility = View.VISIBLE
                              text = "접기"
                          }
                      }
                  }

                  val closeBtn = Button(this).apply {
                      text = "종료"
                      textSize = 11f
                      setOnClickListener { stopSelf() }
                  }

                  topRow.addView(titleText)
                  topRow.addView(styleBtn)
                  topRow.addView(toggleBtn)
                  topRow.addView(minBtn)
                  topRow.addView(closeBtn)

                  // 1. 모자이크 강도(블록 크기) 슬라이더
                  val sizeRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  val sizeLabel = TextView(this).apply {
                      text = "강도(36): "
                      setTextColor(Color.WHITE)
                      textSize = 11f
                      width = 185
                  }
                  val sizeSeek = SeekBar(this).apply {
                      max = 84 // 16 ~ 100px
                      progress = 20 // 기본 36px
                      layoutParams = LinearLayout.LayoutParams(340, ViewGroup.LayoutParams.WRAP_CONTENT)
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(s: SeekBar?, p: Int, fromUser: Boolean) {
                              mosaicBlockSize = p + 16
                              sizeLabel.text = "강도($mosaicBlockSize): "
                          }
                          override fun onStartTrackingTouch(s: SeekBar?) {}
                          override fun onStopTrackingTouch(s: SeekBar?) {}
                      })
                  }
                  sizeRow.addView(sizeLabel)
                  sizeRow.addView(sizeSeek)

                  // 2. 반응 속도(FPS) 슬라이더
                  val fpsRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(0, 8, 0, 0)
                  }
                  val fpsLabel = TextView(this).apply {
                      text = "속도(30fps): "
                      setTextColor(Color.WHITE)
                      textSize = 11f
                      width = 185
                  }
                  val fpsSeek = SeekBar(this).apply {
                      max = 50 // 10 ~ 60fps
                      progress = 20 // 기본 30fps
                      layoutParams = LinearLayout.LayoutParams(340, ViewGroup.LayoutParams.WRAP_CONTENT)
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(s: SeekBar?, p: Int, fromUser: Boolean) {
                              targetFps = p + 10
                              fpsLabel.text = "속도(${targetFps}fps): "
                          }
                          override fun onStartTrackingTouch(s: SeekBar?) {}
                          override fun onStopTrackingTouch(s: SeekBar?) {}
                      })
                  }
                  fpsRow.addView(fpsLabel)
                  fpsRow.addView(fpsSeek)

                  slidersContainer.addView(sizeRow)
                  slidersContainer.addView(fpsRow)
                  rootControl.addView(topRow)
                  rootControl.addView(slidersContainer)

                  val controlParams = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      overlayType,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL
                      y = 100
                  }

                  rootControl.setOnTouchListener(object : View.OnTouchListener {
                      private var initX = 0
                      private var initY = 0
                      private var touchX = 0f
                      private var touchY = 0f
                      override fun onTouch(v: View, e: MotionEvent): Boolean {
                          when (e.action) {
                              MotionEvent.ACTION_DOWN -> {
                                  initX = controlParams.x
                                  initY = controlParams.y
                                  touchX = e.rawX
                                  touchY = e.rawY
                                  return false
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  controlParams.x = initX + (e.rawX - touchX).toInt()
                                  controlParams.y = initY + (e.rawY - touchY).toInt()
                                  windowManager.updateViewLayout(rootControl, controlParams)
                                  return true
                              }
                          }
                          return false
                      }
                  })

                  controlView = rootControl
                  windowManager.addView(controlView, controlParams)
              }

              private fun startScreenCapture(resultCode: Int, data: Intent) {
                  val mpManager = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  mediaProjection = mpManager.getMediaProjection(resultCode, data)
                  mediaProjection?.registerCallback(object : MediaProjection.Callback() {
                      override fun onStop() {
                          stopSelf()
                      }
                  }, mainHandler)
                  setupVirtualDisplay()
              }

              private fun setupVirtualDisplay() {
                  updateScreenMetrics()
                  val oldReader = imageReader
                  val newReader = ImageReader.newInstance(capW, capH, PixelFormat.RGBA_8888, 2)

                  newReader.setOnImageAvailableListener({ reader ->
                      val image = reader.acquireLatestImage() ?: return@setOnImageAvailableListener
                      try {
                          if (!isEnabled) return@setOnImageAvailableListener
                          val now = SystemClock.elapsedRealtime()
                          val minInterval = 1000L / targetFps.coerceIn(10, 60)
                          if (now - lastFrameTimeMs < minInterval) return@setOnImageAvailableListener
                          lastFrameTimeMs = now

                          val plane = image.planes[0]
                          val buffer = plane.buffer
                          val pixelStride = plane.pixelStride
                          val rowStride = plane.rowStride

                          val blockPx = mosaicBlockSize.coerceAtLeast(16)
                          val cols = (screenWidth / blockPx).coerceAtLeast(10)
                          val rows = (screenHeight / blockPx).coerceAtLeast(10)
                          val newColors = IntArray(cols * rows)

                          // 핵심 원리: 각 모자이크 블록의 '좌상단 코너(미세 투명 핀홀 위치)'에 있는 실제 뒷배경 픽셀만 정확히 추출!
                          // 모자이크 타일은 이 핀홀 위치만 비워두고 나머지 94% 면적을 덮으므로, 깜빡임과 잔상(자기 자신 재캡처)이 원천 차단됨!
                          for (r in 0 until rows) {
                              // 핀홀 중심 좌표 (블록 시작점 + 2px 지점)
                              val screenY = (r * blockPx + 2).coerceIn(0, screenHeight - 1)
                              val cy = ((screenY.toLong() * capH) / screenHeight).toInt().coerceIn(0, capH - 1)
                              val rowOffset = cy * rowStride

                              for (c in 0 until cols) {
                                  val screenX = (c * blockPx + 2).coerceIn(0, screenWidth - 1)
                                  val cx = ((screenX.toLong() * capW) / screenWidth).toInt().coerceIn(0, capW - 1)
                                  val offset = rowOffset + cx * pixelStride

                                  val red = buffer.get(offset).toInt() and 0xFF
                                  val green = buffer.get(offset + 1).toInt() and 0xFF
                                  val blue = buffer.get(offset + 2).toInt() and 0xFF

                                  // 추출한 실제 뒷배경 색상을 100% 불투명한 모자이크 타일 색상으로 저장
                                  newColors[r * cols + c] = Color.rgb(red, green, blue)
                              }
                          }

                          gridCols = cols
                          gridRows = rows
                          gridColors = newColors

                          mainHandler.post {
                              mosaicView?.invalidate()
                          }
                      } catch (e: Exception) {
                          e.printStackTrace()
                      } finally {
                          image.close()
                      }
                  }, bgHandler)

                  imageReader = newReader

                  if (virtualDisplay == null) {
                      virtualDisplay = mediaProjection?.createVirtualDisplay(
                          "PinholeReactiveMosaic",
                          capW,
                          capH,
                          screenDensity,
                          DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                          newReader.surface,
                          null,
                          bgHandler
                      )
                  } else {
                      virtualDisplay?.resize(capW, capH, screenDensity)
                      virtualDisplay?.surface = newReader.surface
                  }
                  oldReader?.close()
              }

              override fun onDestroy() {
                  super.onDestroy()
                  isEnabled = false
                  mainHandler.removeCallbacksAndMessages(null)
                  virtualDisplay?.release()
                  imageReader?.close()
                  mediaProjection?.stop()
                  bgThread?.quitSafely()
                  mosaicView?.let { windowManager.removeView(it) }
                  controlView?.let { windowManager.removeView(it) }
              }

              // 핀홀(샘플링 틈)을 제외한 모든 영역을 추출된 실시간 색상으로 덮어그리는 반응형 모자이크 뷰
              inner class ReactiveMosaicView(context: Context) : View(context) {
                  private val fillPaint = Paint().apply {
                      style = Paint.Style.FILL
                      isAntiAlias = false
                  }
                  private val screenLoc = IntArray(2)

                  override fun onDraw(canvas: Canvas) {
                      super.onDraw(canvas)
                      val colors = gridColors
                      val cols = gridCols
                      val rows = gridRows
                      if (colors.isEmpty() || cols <= 0 || rows <= 0) return

                      // 상태표시줄/카메라홀 오프셋 완벽 보정 (위로 밀리는 현상 0%)
                      getLocationOnScreen(screenLoc)
                      val offsetX = -screenLoc[0].toFloat()
                      val offsetY = -screenLoc[1].toFloat()

                      val cellW = screenWidth.toFloat() / cols
                      val cellH = screenHeight.toFloat() / rows

                      // 캡처 해상도(1/4)에서 1픽셀이 순수 원본 화면을 볼 수 있도록 좌상단 코너 혹은 테두리에 4px의 미세 틈(Pinhole)을 유지
                      val gap = if (styleMode == 1) 4f else 5f

                      for (r in 0 until rows) {
                          val top = offsetY + r * cellH
                          val bottom = top + cellH
                          val rowIdx = r * cols

                          for (c in 0 until cols) {
                              if (rowIdx + c >= colors.size) break
                              fillPaint.color = colors[rowIdx + c]
                              val left = offsetX + c * cellW
                              val right = left + cellW

                              when (styleMode) {
                                  0 -> {
                                      // 모드 0: 정통 사각 타일 모자이크 (격자 틈 사이로 실시간 빛을 감지해 즉시 타일 색상이 변함)
                                      canvas.drawRect(left + gap, top + gap, right, bottom, fillPaint)
                                  }
                                  1 -> {
                                      // 모드 1: 밀착 픽셀 모자이크 (타일은 꽉 채우되 좌상단 코너에 아주 작은 핀홀만 남겨 원본 색상 감지)
                                      canvas.drawRect(left + gap, top, right, bottom, fillPaint)
                                      canvas.drawRect(left, top + gap, left + gap, bottom, fillPaint)
                                  }
                                  else -> {
                                      // 모드 2: 원형 LED 도트 모자이크 (좌상단 코너 여백으로 원본 감지 + 원형 도트가 실시간 반응)
                                      val cx = (left + right) * 0.5f
                                      val cy = (top + bottom) * 0.5f
                                      val radius = (minOf(cellW, cellH) * 0.48f)
                                      canvas.drawCircle(cx, cy, radius, fillPaint)
                                  }
                              }
                          }
                      }
                  }
              }
          }
          EOF

          sed -i 's/^          //' settings.gradle build.gradle gradle.properties app/build.gradle app/src/main/AndroidManifest.xml app/src/main/java/com/example/mosaicoverlay/MainActivity.kt app/src/main/java/com/example/mosaicoverlay/MosaicService.kt

          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GalaxyNote10-FullScreen-Mosaic-APK-v5
          path: app/build/outputs/apk/debug/app-debug.apk
