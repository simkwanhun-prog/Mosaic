name: Build FullScreen Mosaic APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate Project and Build APK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

          mkdir -p app/src/main/java/com/example/mosaicoverlay

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MosaicOverlay"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.example.mosaicoverlay'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.mosaicoverlay"
                  minSdk 29
                  targetSdk 33
                  versionCode 4
                  versionName "4.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <application
                  android:allowBackup="true"
                  android:label="전체화면 모자이크"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".MosaicService"
                      android:enabled="true"
                      android:exported="false"
                      android:configChanges="orientation|screenSize|screenLayout"
                      android:foregroundServiceType="specialUse" />
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/mosaicoverlay/MainActivity.kt
          package com.example.mosaicoverlay

          import android.app.Activity
          import android.content.Intent
          import android.graphics.Color
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {
              private val REQ_OVERLAY = 1001

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(60, 60, 60, 60)
                      setBackgroundColor(Color.parseColor("#F5F5F5"))
                  }
                  val infoText = TextView(this).apply {
                      text = "갤럭시 노트 10 전체화면 모자이크 v4.0\n(무캡처 순수 광학 필터 버전)\n\n" +
                             "• 화면 캡처 방식을 완전히 제거하여 깜빡임, 잔상, 렉이 0%입니다.\n" +
                             "• 동영상 프레임(60fps)이 원본 그대로 부드럽게 유지됩니다.\n" +
                             "• 제어판에서 [크기], [강도(농도)], [3가지 모자이크 패턴]을 실시간으로 변경할 수 있습니다."
                      textSize = 14f
                      setTextColor(Color.BLACK)
                      setPadding(0, 0, 0, 50)
                  }
                  val startBtn = Button(this).apply {
                      text = "모자이크 필터 즉시 켜기"
                      textSize = 17f
                      setOnClickListener { checkPermissionsAndStart() }
                  }
                  val stopBtn = Button(this).apply {
                      text = "모자이크 완전히 종료"
                      textSize = 17f
                      setOnClickListener {
                          stopService(Intent(this@MainActivity, MosaicService::class.java))
                      }
                  }
                  layout.addView(infoText)
                  layout.addView(startBtn)
                  layout.addView(stopBtn)
                  setContentView(layout)
              }

              private fun checkPermissionsAndStart() {
                  if (!Settings.canDrawOverlays(this)) {
                      Toast.makeText(this, "'다른 앱 위에 표시' 권한을 허용해주세요.", Toast.LENGTH_LONG).show()
                      val intent = Intent(
                          Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                          Uri.parse("package:$packageName")
                      )
                      startActivityForResult(intent, REQ_OVERLAY)
                  } else {
                      startMosaicFilter()
                  }
              }

              private fun startMosaicFilter() {
                  val serviceIntent = Intent(this, MosaicService::class.java)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      startForegroundService(serviceIntent)
                  } else {
                      startService(serviceIntent)
                  }
                  moveTaskToBack(true)
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == REQ_OVERLAY && Settings.canDrawOverlays(this)) {
                      startMosaicFilter()
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/mosaicoverlay/MosaicService.kt
          package com.example.mosaicoverlay

          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.graphics.*
          import android.os.*
          import android.view.*
          import android.widget.*

          class MosaicService : Service() {
              private lateinit var windowManager: WindowManager
              private var mosaicView: PureMosaicFilterView? = null
              private var controlView: View? = null

              // 1. 모자이크 타일 크기 (8 ~ 80px)
              private var tileSize = 24
              // 2. 모자이크 차폐 강도/농도 (40 ~ 245)
              private var filterIntensity = 185
              // 3. 패턴 모드 (0: 입체 유리 타일, 1: 체커보드 픽셀, 2: 마이크로 도트 매트릭스)
              private var patternMode = 0

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  windowManager = getSystemService(Context.WINDOW_SERVICE) as WindowManager
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  startForegroundNotification()
                  setupOverlayViews()
                  return START_STICKY
              }

              private fun startForegroundNotification() {
                  val channelId = "mosaic_filter_channel"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          channelId,
                          "순수 모자이크 필터 서비스",
                          NotificationManager.IMPORTANCE_LOW
                      )
                      val manager = getSystemService(NotificationManager::class.java)
                      manager.createNotificationChannel(channel)
                  }
                  val notification = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      Notification.Builder(this, channelId)
                          .setContentTitle("순수 모자이크 필터 작동 중 (깜빡임 없음)")
                          .setContentText("상단 제어판에서 타일 크기와 강도를 조절하세요.")
                          .setSmallIcon(android.R.drawable.ic_menu_view)
                          .build()
                  } else {
                      @Suppress("DEPRECATION")
                      Notification.Builder(this)
                          .setContentTitle("순수 모자이크 필터 작동 중")
                          .setSmallIcon(android.R.drawable.ic_menu_view)
                          .build()
                  }
                  startForeground(1, notification)
              }

              private fun setupOverlayViews() {
                  if (mosaicView != null) return
                  mosaicView = PureMosaicFilterView(this).apply {
                      rebuildShader()
                  }

                  val overlayType = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  } else {
                      @Suppress("DEPRECATION")
                      WindowManager.LayoutParams.TYPE_PHONE
                  }

                  val mosaicParams = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      overlayType,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                              WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                              WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                              WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS or
                              WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                          layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                      }
                      // 안드로이드 12 이상 기기에서 지원하는 경우 하드웨어 배경 블러까지 동시 활성화
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                          flags = flags or WindowManager.LayoutParams.FLAG_BLUR_BEHIND
                          blurBehindRadius = 25
                      }
                  }
                  windowManager.addView(mosaicView, mosaicParams)

                  val rootControl = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.argb(225, 20, 20, 20))
                      setPadding(24, 14, 24, 14)
                  }
                  val topRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  val titleText = TextView(this).apply {
                      text = "⠿ 필터 제어판 "
                      setTextColor(Color.WHITE)
                      textSize = 12f
                  }
                  val slidersContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(0, 10, 0, 0)
                  }

                  val modeBtn = Button(this).apply {
                      text = "패턴: 유리타일"
                      textSize = 11f
                      setOnClickListener {
                          patternMode = (patternMode + 1) % 3
                          text = when (patternMode) {
                              0 -> "패턴: 유리타일"
                              1 -> "패턴: 픽셀격자"
                              else -> "패턴: 도트필터"
                          }
                          mosaicView?.rebuildShader()
                      }
                  }

                  val toggleBtn = Button(this).apply {
                      text = "ON"
                      textSize = 11f
                      setOnClickListener {
                          if (mosaicView?.visibility == View.VISIBLE) {
                              mosaicView?.visibility = View.INVISIBLE
                              text = "OFF"
                          } else {
                              mosaicView?.visibility = View.VISIBLE
                              text = "ON"
                          }
                      }
                  }

                  val minBtn = Button(this).apply {
                      text = "접기"
                      textSize = 11f
                      setOnClickListener {
                          if (slidersContainer.visibility == View.VISIBLE) {
                              slidersContainer.visibility = View.GONE
                              text = "펼치기"
                          } else {
                              slidersContainer.visibility = View.VISIBLE
                              text = "접기"
                          }
                      }
                  }

                  val closeBtn = Button(this).apply {
                      text = "종료"
                      textSize = 11f
                      setOnClickListener { stopSelf() }
                  }

                  topRow.addView(titleText)
                  topRow.addView(modeBtn)
                  topRow.addView(toggleBtn)
                  topRow.addView(minBtn)
                  topRow.addView(closeBtn)

                  // 1. 모자이크 타일 크기 슬라이더
                  val sizeRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  val sizeLabel = TextView(this).apply {
                      text = "타일크기(24): "
                      setTextColor(Color.WHITE)
                      textSize = 11f
                      width = 200
                  }
                  val sizeSeek = SeekBar(this).apply {
                      max = 72 // 8 ~ 80px
                      progress = 16
                      layoutParams = LinearLayout.LayoutParams(340, ViewGroup.LayoutParams.WRAP_CONTENT)
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(s: SeekBar?, p: Int, fromUser: Boolean) {
                              tileSize = p + 8
                              sizeLabel.text = "타일크기($tileSize): "
                              mosaicView?.rebuildShader()
                          }
                          override fun onStartTrackingTouch(s: SeekBar?) {}
                          override fun onStopTrackingTouch(s: SeekBar?) {}
                      })
                  }
                  sizeRow.addView(sizeLabel)
                  sizeRow.addView(sizeSeek)

                  // 2. 모자이크 가림 강도(농도) 슬라이더
                  val alphaRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(0, 8, 0, 0)
                  }
                  val alphaLabel = TextView(this).apply {
                      text = "가림강도(72%): "
                      setTextColor(Color.WHITE)
                      textSize = 11f
                      width = 200
                  }
                  val alphaSeek = SeekBar(this).apply {
                      max = 205 // 40 ~ 245
                      progress = 145 // 기본 185 (72%)
                      layoutParams = LinearLayout.LayoutParams(340, ViewGroup.LayoutParams.WRAP_CONTENT)
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(s: SeekBar?, p: Int, fromUser: Boolean) {
                              filterIntensity = p + 40
                              val pct = (filterIntensity * 100) / 255
                              alphaLabel.text = "가림강도(${pct}%): "
                              mosaicView?.rebuildShader()
                          }
                          override fun onStartTrackingTouch(s: SeekBar?) {}
                          override fun onStopTrackingTouch(s: SeekBar?) {}
                      })
                  }
                  alphaRow.addView(alphaLabel)
                  alphaRow.addView(alphaSeek)

                  slidersContainer.addView(sizeRow)
                  slidersContainer.addView(alphaRow)
                  rootControl.addView(topRow)
                  rootControl.addView(slidersContainer)

                  val controlParams = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      overlayType,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL
                      y = 100
                  }

                  rootControl.setOnTouchListener(object : View.OnTouchListener {
                      private var initX = 0
                      private var initY = 0
                      private var touchX = 0f
                      private var touchY = 0f
                      override fun onTouch(v: View, e: MotionEvent): Boolean {
                          when (e.action) {
                              MotionEvent.ACTION_DOWN -> {
                                  initX = controlParams.x
                                  initY = controlParams.y
                                  touchX = e.rawX
                                  touchY = e.rawY
                                  return false
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  controlParams.x = initX + (e.rawX - touchX).toInt()
                                  controlParams.y = initY + (e.rawY - touchY).toInt()
                                  windowManager.updateViewLayout(rootControl, controlParams)
                                  return true
                              }
                          }
                          return false
                      }
                  })

                  controlView = rootControl
                  windowManager.addView(controlView, controlParams)
              }

              override fun onDestroy() {
                  super.onDestroy()
                  mosaicView?.let { windowManager.removeView(it) }
                  controlView?.let { windowManager.removeView(it) }
              }

              // 캡처 없이 GPU BitmapShader 타일링만으로 화면 전체에 즉각적인 모자이크 질감을 입히는 뷰
              inner class PureMosaicFilterView(context: Context) : View(context) {
                  private val paint = Paint(Paint.ANTI_ALIAS_FLAG)
                  private var tileBitmap: Bitmap? = null

                  fun rebuildShader() {
                      val size = tileSize.coerceAtLeast(6)
                      val alpha = filterIntensity.coerceIn(30, 250)

                      tileBitmap?.recycle()
                      // 2x2 모자이크 블록 패턴을 생성하여 전체 화면에 끊김 없이 반복(REPEAT) 렌더링
                      val bmp = Bitmap.createBitmap(size * 2, size * 2, Bitmap.Config.ARGB_8888)
                      val c = Canvas(bmp)
                      val p = Paint(Paint.ANTI_ALIAS_FLAG)

                      when (patternMode) {
                          0 -> {
                              // 모드 0: 입체 유리 모자이크 타일 (빛의 명암 교차로 뒷배경 글씨/영상을 자연스럽게 뭉개줌)
                              for (row in 0..1) {
                                  for (col in 0..1) {
                                      val left = (col * size).toFloat()
                                      val top = (row * size).toFloat()
                                      val right = left + size
                                      val bottom = top + size

                                      val baseGray = if ((row + col) % 2 == 0) 150 else 105
                                      p.style = Paint.Style.FILL
                                      p.color = Color.argb(alpha, baseGray, baseGray, baseGray)
                                      c.drawRect(left, top, right, bottom, p)

                                      // 타일 내부 중앙 코어 (광학 왜곡 효과)
                                      val inset = (size * 0.22f).coerceAtLeast(2f)
                                      val coreAlpha = (alpha * 0.65f).toInt()
                                      val coreGray = if ((row + col) % 2 == 0) 210 else 65
                                      p.color = Color.argb(coreAlpha, coreGray, coreGray, coreGray)
                                      c.drawRect(left + inset, top + inset, right - inset, bottom - inset, p)

                                      // 모자이크 칼각 테두리 (베벨 효과)
                                      p.style = Paint.Style.STROKE
                                      p.strokeWidth = 2f
                                      p.color = Color.argb((alpha + 25).coerceAtMost(255), 35, 35, 35)
                                      c.drawRect(left, top, right, bottom, p)
                                  }
                              }
                          }
                          1 -> {
                              // 모드 1: 고밀도 픽셀 격자 (어두운 톤으로 차분하게 화면 디테일 차폐)
                              for (row in 0..1) {
                                  for (col in 0..1) {
                                      val left = (col * size).toFloat()
                                      val top = (row * size).toFloat()
                                      val isEven = (row + col) % 2 == 0
                                      p.style = Paint.Style.FILL
                                      p.color = if (isEven) {
                                          Color.argb(alpha, 28, 28, 28)
                                      } else {
                                          Color.argb((alpha * 0.55f).toInt(), 90, 90, 90)
                                      }
                                      c.drawRect(left, top, left + size, top + size, p)

                                      p.style = Paint.Style.STROKE
                                      p.strokeWidth = 1.5f
                                      p.color = Color.argb(alpha, 0, 0, 0)
                                      c.drawRect(left, top, left + size, top + size, p)
                                  }
                              }
                          }
                          else -> {
                              // 모드 2: 도트 매트릭스 프라이버시 필터 (공공장소 시야 차단 및 윤곽선 파쇄)
                              c.drawColor(Color.argb((alpha * 0.85f).toInt(), 18, 18, 18))
                              p.style = Paint.Style.FILL
                              // 4개의 타일 중앙에 투명도가 다른 원형 렌즈 배치
                              for (row in 0..1) {
                                  for (col in 0..1) {
                                      val cx = col * size + size / 2f
                                      val cy = row * size + size / 2f
                                      val radius = size * 0.36f
                                      p.color = Color.argb((alpha * 0.35f).toInt(), 190, 190, 190)
                                      c.drawCircle(cx, cy, radius, p)
                                  }
                              }
                          }
                      }

                      tileBitmap = bmp
                      paint.shader = BitmapShader(bmp, Shader.TileMode.REPEAT, Shader.TileMode.REPEAT)
                      invalidate()
                  }

                  override fun onDraw(canvas: Canvas) {
                      super.onDraw(canvas)
                      canvas.drawRect(0f, 0f, width.toFloat(), height.toFloat(), paint)
                  }
              }
          }
          EOF

          sed -i 's/^          //' settings.gradle build.gradle gradle.properties app/build.gradle app/src/main/AndroidManifest.xml app/src/main/java/com/example/mosaicoverlay/MainActivity.kt app/src/main/java/com/example/mosaicoverlay/MosaicService.kt

          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GalaxyNote10-FullScreen-Mosaic-APK-v4
          path: app/build/outputs/apk/debug/app-debug.apk
