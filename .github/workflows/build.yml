name: Build FullScreen Mosaic APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate Project and Build APK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

          mkdir -p app/src/main/java/com/example/mosaicoverlay

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MosaicOverlay"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.example.mosaicoverlay'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.mosaicoverlay"
                  minSdk 29
                  targetSdk 33
                  versionCode 3
                  versionName "3.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <application
                  android:allowBackup="true"
                  android:label="전체화면 모자이크"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".MosaicService"
                      android:enabled="true"
                      android:exported="false"
                      android:configChanges="orientation|screenSize|screenLayout"
                      android:foregroundServiceType="mediaProjection" />
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/mosaicoverlay/MainActivity.kt
          package com.example.mosaicoverlay

          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {
              private lateinit var projectionManager: MediaProjectionManager
              private val REQ_OVERLAY = 1001
              private val REQ_CAPTURE = 1002

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  projectionManager = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager

                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(60, 60, 60, 60)
                      setBackgroundColor(Color.parseColor("#F5F5F5"))
                  }
                  val infoText = TextView(this).apply {
                      text = "갤럭시 노트 10 전체화면 모자이크 v3.0\n(밀림 방지 & VSync 프레임 동기화 버전)\n\n" +
                             "• 카메라 홀 영역까지 1:1로 맞춰 모자이크가 위로 밀려 올라가는 현상을 완벽히 제거했습니다.\n" +
                             "• 화면 주사율(VSync) 동기화로 깜빡임을 최소화하고, 가로/세로 회전에도 자동 대응합니다.\n" +
                             "• [모드 전환]: 깜빡임 없는 '연속 필터 모드'와 '실시간 갱신 모드'를 선택할 수 있습니다."
                      textSize = 14f
                      setTextColor(Color.BLACK)
                      setPadding(0, 0, 0, 50)
                  }
                  val startBtn = Button(this).apply {
                      text = "전체화면 모자이크 시작"
                      textSize = 17f
                      setOnClickListener { checkPermissionsAndStart() }
                  }
                  val stopBtn = Button(this).apply {
                      text = "모자이크 완전히 종료"
                      textSize = 17f
                      setOnClickListener {
                          stopService(Intent(this@MainActivity, MosaicService::class.java))
                      }
                  }
                  layout.addView(infoText)
                  layout.addView(startBtn)
                  layout.addView(stopBtn)
                  setContentView(layout)
              }

              private fun checkPermissionsAndStart() {
                  if (!Settings.canDrawOverlays(this)) {
                      Toast.makeText(this, "'다른 앱 위에 표시' 권한을 허용해주세요.", Toast.LENGTH_LONG).show()
                      val intent = Intent(
                          Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                          Uri.parse("package:$packageName")
                      )
                      startActivityForResult(intent, REQ_OVERLAY)
                  } else {
                      requestScreenCapture()
                  }
              }

              private fun requestScreenCapture() {
                  startActivityForResult(projectionManager.createScreenCaptureIntent(), REQ_CAPTURE)
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == REQ_OVERLAY) {
                      if (Settings.canDrawOverlays(this)) {
                          requestScreenCapture()
                      }
                  } else if (requestCode == REQ_CAPTURE) {
                      if (resultCode == RESULT_OK && data != null) {
                          val serviceIntent = Intent(this, MosaicService::class.java).apply {
                              putExtra("resultCode", resultCode)
                              putExtra("data", data)
                          }
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              startForegroundService(serviceIntent)
                          } else {
                              startService(serviceIntent)
                          }
                          moveTaskToBack(true)
                      } else {
                          Toast.makeText(this, "화면 캡처 권한이 취소되었습니다.", Toast.LENGTH_SHORT).show()
                      }
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/mosaicoverlay/MosaicService.kt
          package com.example.mosaicoverlay

          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.content.res.Configuration
          import android.graphics.*
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.*
          import android.util.DisplayMetrics
          import android.view.*
          import android.widget.*

          class MosaicService : Service(), Choreographer.FrameCallback {
              private lateinit var windowManager: WindowManager
              private var mediaProjection: MediaProjection? = null
              private var virtualDisplay: VirtualDisplay? = null
              private var imageReader: ImageReader? = null
              private var mosaicView: MosaicOverlayView? = null
              private var controlView: View? = null

              private var screenWidth = 1080
              private var screenHeight = 2280
              private var screenDensity = 400

              // 설정값: 모자이크 블록 크기(강도), 동기화 주기, 투명도
              @Volatile private var mosaicBlockSize = 24
              @Volatile private var syncIntervalFrames = 4 // VSync 기준 N프레임마다 동기화 (값이 작을수록 빠른 갱신, 클수록 깜빡임 감소)
              @Volatile private var overlayOpacity = 235   // 0~255 (살짝 반투명하게 하면 깜빡임 체감이 대폭 줄어듦)
              @Volatile private var isEnabled = true

              // VSync 상태 머신: 0 = 모자이크 유지 상태, 1 = 원본 프레임 스텔스 캡처 대기, 2 = 버퍼 픽셀 추출 및 복구
              private var vsyncState = 0
              private var frameCounter = 0

              // 메모리 재사용을 위한 더블 버퍼링 비트맵
              private var frontBitmap: Bitmap? = null
              private var backBitmap: Bitmap? = null

              private val mainHandler = Handler(Looper.getMainLooper())
              private var bgThread: HandlerThread? = null
              private var bgHandler: Handler? = null

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  windowManager = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  updateScreenMetrics()
                  bgThread = HandlerThread("MosaicCaptureThread", Process.THREAD_PRIORITY_DISPLAY).apply { start() }
                  bgHandler = Handler(bgThread!!.looper)
              }

              private fun updateScreenMetrics() {
                  val metrics = DisplayMetrics()
                  @Suppress("DEPRECATION")
                  windowManager.defaultDisplay.getRealMetrics(metrics)
                  screenWidth = metrics.widthPixels
                  screenHeight = metrics.heightPixels
                  screenDensity = metrics.densityDpi
              }

              // 가로/세로 회전 시 자동으로 해상도 및 좌표 재동기화
              override fun onConfigurationChanged(newConfig: Configuration) {
                  super.onConfigurationChanged(newConfig)
                  updateScreenMetrics()
                  bgHandler?.post { rebuildCaptureResolution() }
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  startForegroundNotification()
                  val resultCode = intent?.getIntExtra("resultCode", Activity.RESULT_CANCELED) ?: Activity.RESULT_CANCELED
                  @Suppress("DEPRECATION")
                  val data: Intent? = intent?.getParcelableExtra("data")

                  if (resultCode == Activity.RESULT_OK && data != null) {
                      setupOverlayViews()
                      startScreenCapture(resultCode, data)
                      Choreographer.getInstance().postFrameCallback(this)
                  } else {
                      stopSelf()
                  }
                  return START_NOT_STICKY
              }

              // 하드웨어 주사율(VSync, 60Hz)과 1:1로 맞물려 돌아가는 프레임 동기화 콜백
              override fun doFrame(frameTimeNanos: Long) {
                  if (!isEnabled || mosaicView == null) return

                  when (vsyncState) {
                      0 -> {
                          frameCounter++
                          if (frameCounter >= syncIntervalFrames) {
                              frameCounter = 0
                              // 딱 1 VSync 프레임(16.6ms) 동안만 모자이크를 비켜주어 순수 원본 동영상 프레임을 획득 (위로 밀림 및 잔상 원천 차단)
                              mosaicView?.alpha = 0f
                              vsyncState = 1
                          }
                      }
                      1 -> {
                          // SurfaceFlinger가 순수 원본 화면을 합성한 직후의 VSync 타이밍 -> 즉시 캡처하고 모자이크 화면 복구
                          extractCleanFrameFromReader()
                          mosaicView?.alpha = overlayOpacity / 255f
                          mosaicView?.invalidate()
                          vsyncState = 0
                      }
                  }

                  if (isEnabled) {
                      Choreographer.getInstance().postFrameCallback(this)
                  }
              }

              private fun extractCleanFrameFromReader() {
                  val reader = imageReader ?: return
                  val image = try {
                      reader.acquireLatestImage()
                  } catch (e: Exception) {
                      null
                  } ?: return

                  try {
                      val smallW = image.width
                      val smallH = image.height
                      val plane = image.planes[0]
                      val buffer = plane.buffer
                      val pixelStride = plane.pixelStride
                      val rowStride = plane.rowStride
                      val rowPadding = rowStride - pixelStride * smallW
                      val wWithPad = smallW + rowPadding / pixelStride

                      // Bitmap 객체를 매번 새로 만들지 않고 재사용하여 렉(GC 멈춤) 방지
                      var workBmp = backBitmap
                      if (workBmp == null || workBmp.width != wWithPad || workBmp.height != smallH) {
                          workBmp?.recycle()
                          workBmp = Bitmap.createBitmap(wWithPad, smallH, Bitmap.Config.ARGB_8888)
                          backBitmap = workBmp
                      }
                      buffer.rewind()
                      workBmp.copyPixelsFromBuffer(buffer)

                      var destBmp = frontBitmap
                      if (destBmp == null || destBmp.width != smallW || destBmp.height != smallH) {
                          destBmp?.recycle()
                          destBmp = Bitmap.createBitmap(smallW, smallH, Bitmap.Config.ARGB_8888)
                          frontBitmap = destBmp
                      }

                      // 패딩 영역을 제거하고 정확히 원본 비율(smallW x smallH)만 복사
                      val canvas = Canvas(destBmp)
                      val srcRect = Rect(0, 0, smallW, smallH)
                      val dstRect = Rect(0, 0, smallW, smallH)
                      canvas.drawBitmap(workBmp, srcRect, dstRect, null)
                  } catch (e: Exception) {
                      e.printStackTrace()
                  } finally {
                      image.close()
                  }
              }

              private fun startForegroundNotification() {
                  val channelId = "mosaic_service_channel"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          channelId,
                          "전체화면 모자이크 서비스",
                          NotificationManager.IMPORTANCE_LOW
                      )
                      val manager = getSystemService(NotificationManager::class.java)
                      manager.createNotificationChannel(channel)
                  }
                  val notification = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      Notification.Builder(this, channelId)
                          .setContentTitle("전체화면 모자이크 v3.0 작동 중")
                          .setContentText("VSync 프레임 동기화 및 밀림 방지 적용됨")
                          .setSmallIcon(android.R.drawable.ic_menu_view)
                          .build()
                  } else {
                      @Suppress("DEPRECATION")
                      Notification.Builder(this)
                          .setContentTitle("전체화면 모자이크 작동 중")
                          .setSmallIcon(android.R.drawable.ic_menu_view)
                          .build()
                  }
                  startForeground(1, notification)
              }

              private fun setupOverlayViews() {
                  if (mosaicView != null) return
                  mosaicView = MosaicOverlayView(this).apply {
                      alpha = overlayOpacity / 255f
                  }

                  val overlayType = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  } else {
                      @Suppress("DEPRECATION")
                      WindowManager.LayoutParams.TYPE_PHONE
                  }

                  // 핵심: 갤럭시 노트 10 상단 카메라 홀(Cutout) 영역까지 완벽히 포함하여 위로 밀리는 현상(Drift)을 100% 해결!
                  val mosaicParams = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      overlayType,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                              WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                              WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                              WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS or
                              WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = 0
                      y = 0
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                          layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                      }
                  }
                  windowManager.addView(mosaicView, mosaicParams)

                  val rootControl = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.argb(220, 20, 20, 20))
                      setPadding(24, 14, 24, 14)
                  }
                  val topRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  val titleText = TextView(this).apply {
                      text = "⠿ 제어판 "
                      setTextColor(Color.WHITE)
                      textSize = 12f
                  }
                  val slidersContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(0, 10, 0, 0)
                  }
                  val toggleBtn = Button(this).apply {
                      text = "ON"
                      textSize = 11f
                      setOnClickListener {
                          isEnabled = !isEnabled
                          if (isEnabled) {
                              mosaicView?.visibility = View.VISIBLE
                              text = "ON"
                              Choreographer.getInstance().removeFrameCallback(this@MosaicService)
                              Choreographer.getInstance().postFrameCallback(this@MosaicService)
                          } else {
                              Choreographer.getInstance().removeFrameCallback(this@MosaicService)
                              mosaicView?.visibility = View.INVISIBLE
                              text = "OFF"
                          }
                      }
                  }
                  val minBtn = Button(this).apply {
                      text = "접기"
                      textSize = 11f
                      setOnClickListener {
                          if (slidersContainer.visibility == View.VISIBLE) {
                              slidersContainer.visibility = View.GONE
                              text = "펼치기"
                          } else {
                              slidersContainer.visibility = View.VISIBLE
                              text = "접기"
                          }
                      }
                  }
                  val closeBtn = Button(this).apply {
                      text = "종료"
                      textSize = 11f
                      setOnClickListener { stopSelf() }
                  }

                  topRow.addView(titleText)
                  topRow.addView(toggleBtn)
                  topRow.addView(minBtn)
                  topRow.addView(closeBtn)

                  // 1. 모자이크 강도 슬라이더
                  val strengthRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  val strengthLabel = TextView(this).apply {
                      text = "강도(24): "
                      setTextColor(Color.WHITE)
                      textSize = 11f
                      width = 185
                  }
                  val strengthSeek = SeekBar(this).apply {
                      max = 60
                      progress = 20
                      layoutParams = LinearLayout.LayoutParams(340, ViewGroup.LayoutParams.WRAP_CONTENT)
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(s: SeekBar?, p: Int, fromUser: Boolean) {
                              mosaicBlockSize = p + 4
                              strengthLabel.text = "강도($mosaicBlockSize): "
                          }
                          override fun onStartTrackingTouch(s: SeekBar?) {}
                          override fun onStopTrackingTouch(s: SeekBar?) {
                              bgHandler?.post { rebuildCaptureResolution() }
                          }
                      })
                  }
                  strengthRow.addView(strengthLabel)
                  strengthRow.addView(strengthSeek)

                  // 2. VSync 프레임 동기화 주기 슬라이더 (동영상 속도 vs 깜빡임 제어)
                  val fpsRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(0, 8, 0, 0)
                  }
                  val fpsLabel = TextView(this).apply {
                      text = "동기화(15Hz): "
                      setTextColor(Color.WHITE)
                      textSize = 11f
                      width = 185
                  }
                  val fpsSeek = SeekBar(this).apply {
                      max = 10 // 0(초고속 30Hz) ~ 10(깜빡임 최소화 5Hz)
                      progress = 2 // 기본 4프레임당 1회 (15Hz)
                      layoutParams = LinearLayout.LayoutParams(340, ViewGroup.LayoutParams.WRAP_CONTENT)
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(s: SeekBar?, p: Int, fromUser: Boolean) {
                              // 2프레임(30fps) ~ 12프레임(5fps) 간격으로 VSync와 칼같이 동기화
                              syncIntervalFrames = p + 2
                              val hz = 60 / syncIntervalFrames
                              fpsLabel.text = "동기화(${hz}Hz): "
                          }
                          override fun onStartTrackingTouch(s: SeekBar?) {}
                          override fun onStopTrackingTouch(s: SeekBar?) {}
                      })
                  }
                  fpsRow.addView(fpsLabel)
                  fpsRow.addView(fpsSeek)

                  // 3. 눈부심/깜빡임 완화용 농도(투명도) 슬라이더
                  val alphaRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(0, 8, 0, 0)
                  }
                  val alphaLabel = TextView(this).apply {
                      text = "농도(92%): "
                      setTextColor(Color.WHITE)
                      textSize = 11f
                      width = 185
                  }
                  val alphaSeek = SeekBar(this).apply {
                      max = 55 // 200 ~ 255
                      progress = 35 // 기본 235 (92%) -> 100% 불투명보다 눈의 피로와 깜빡임 체감이 훨씬 적음
                      layoutParams = LinearLayout.LayoutParams(340, ViewGroup.LayoutParams.WRAP_CONTENT)
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(s: SeekBar?, p: Int, fromUser: Boolean) {
                              overlayOpacity = p + 200
                              val pct = (overlayOpacity * 100) / 255
                              alphaLabel.text = "농도(${pct}%): "
                              if (vsyncState == 0) {
                                  mosaicView?.alpha = overlayOpacity / 255f
                              }
                          }
                          override fun onStartTrackingTouch(s: SeekBar?) {}
                          override fun onStopTrackingTouch(s: SeekBar?) {}
                      })
                  }
                  alphaRow.addView(alphaLabel)
                  alphaRow.addView(alphaSeek)

                  slidersContainer.addView(strengthRow)
                  slidersContainer.addView(fpsRow)
                  slidersContainer.addView(alphaRow)
                  rootControl.addView(topRow)
                  rootControl.addView(slidersContainer)

                  val controlParams = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      overlayType,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL
                      y = 100
                  }

                  rootControl.setOnTouchListener(object : View.OnTouchListener {
                      private var initX = 0
                      private var initY = 0
                      private var touchX = 0f
                      private var touchY = 0f
                      override fun onTouch(v: View, e: MotionEvent): Boolean {
                          when (e.action) {
                              MotionEvent.ACTION_DOWN -> {
                                  initX = controlParams.x
                                  initY = controlParams.y
                                  touchX = e.rawX
                                  touchY = e.rawY
                                  return false
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  controlParams.x = initX + (e.rawX - touchX).toInt()
                                  controlParams.y = initY + (e.rawY - touchY).toInt()
                                  windowManager.updateViewLayout(rootControl, controlParams)
                                  return true
                              }
                          }
                          return false
                      }
                  })

                  controlView = rootControl
                  windowManager.addView(controlView, controlParams)
              }

              private fun startScreenCapture(resultCode: Int, data: Intent) {
                  val mpManager = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  mediaProjection = mpManager.getMediaProjection(resultCode, data)
                  mediaProjection?.registerCallback(object : MediaProjection.Callback() {
                      override fun onStop() {
                          stopSelf()
                      }
                  }, mainHandler)
                  rebuildCaptureResolution()
              }

              private fun rebuildCaptureResolution() {
                  updateScreenMetrics()
                  val factor = mosaicBlockSize.coerceAtLeast(4)
                  val smallW = (screenWidth / factor).coerceAtLeast(16)
                  val smallH = (screenHeight / factor).coerceAtLeast(16)

                  val oldReader = imageReader
                  val newReader = ImageReader.newInstance(smallW, smallH, PixelFormat.RGBA_8888, 3)
                  imageReader = newReader

                  if (virtualDisplay == null) {
                      virtualDisplay = mediaProjection?.createVirtualDisplay(
                          "FastHardwareMosaicV3",
                          smallW,
                          smallH,
                          screenDensity,
                          DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                          newReader.surface,
                          null,
                          bgHandler
                      )
                  } else {
                      virtualDisplay?.resize(smallW, smallH, screenDensity)
                      virtualDisplay?.surface = newReader.surface
                  }
                  oldReader?.close()
              }

              override fun onDestroy() {
                  super.onDestroy()
                  isEnabled = false
                  Choreographer.getInstance().removeFrameCallback(this)
                  mainHandler.removeCallbacksAndMessages(null)
                  virtualDisplay?.release()
                  imageReader?.close()
                  mediaProjection?.stop()
                  bgThread?.quitSafely()
                  mosaicView?.let { windowManager.removeView(it) }
                  controlView?.let { windowManager.removeView(it) }
                  frontBitmap?.recycle()
                  backBitmap?.recycle()
              }

              // 절대 좌표 보정(LocationOnScreen)이 들어간 렌더링 뷰: 어떤 화면에서도 모자이크가 밀리지 않음
              inner class MosaicOverlayView(context: Context) : View(context) {
                  private val paint = Paint().apply {
                      isFilterBitmap = false
                      isAntiAlias = false
                      isDither = false
                  }
                  private val screenLoc = IntArray(2)
                  private val destRect = Rect()

                  override fun onDraw(canvas: Canvas) {
                      super.onDraw(canvas)
                      val bmp = frontBitmap
                      if (bmp != null && !bmp.isRecycled) {
                          // 혹시라도 OS가 뷰 위치를 상태표시줄만큼 내렸다면 그 오프셋을 정확히 역보정하여 실제 화면과 1:1 일치시킴
                          getLocationOnScreen(screenLoc)
                          val offsetX = -screenLoc[0]
                          val offsetY = -screenLoc[1]
                          destRect.set(offsetX, offsetY, offsetX + screenWidth, offsetY + screenHeight)
                          canvas.drawBitmap(bmp, null, destRect, paint)
                      }
                  }
              }
          }
          EOF

          sed -i 's/^          //' settings.gradle build.gradle gradle.properties app/build.gradle app/src/main/AndroidManifest.xml app/src/main/java/com/example/mosaicoverlay/MainActivity.kt app/src/main/java/com/example/mosaicoverlay/MosaicService.kt

          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GalaxyNote10-FullScreen-Mosaic-APK-v3
          path: app/build/outputs/apk/debug/app-debug.apk
